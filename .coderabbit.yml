# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit config for Magik — an AI-first, full-stack Ruby framework on TruffleRuby.
#
# The review instructions below are the conventions a test cannot check. Everything a test CAN
# check is already `bin/check` (rubocop, test, yard, build, cli, docs, checks) and there is no
# value in a reviewer repeating it — so these instructions deliberately cover only the rules that
# need judgement: whether a claim is true, whether an error is actionable, whether a stub is honest.
#
# The single most important one: NOTHING IN THIS FRAMEWORK IS IMPLEMENTED. `docs/idea/00-build-spec.md`
# reads like documentation for a working product and is a plan. A diff that describes any of it in
# the present tense is wrong, and that is the failure this repository is organised against.

language: 'en-US'

# Hard limit: 250 characters. Over it the whole file fails to parse and CodeRabbit silently reviews
# with its defaults, dropping every instruction below with it.
tone_instructions: >-
  Terse and concrete. Lead with the rule and cite the file stating it; skip nitpicks RuboCop
  catches. The reader is an AI agent: block whatever makes a failure unreadable to one — a bare
  raise, a fix: that is advice, a command with no --json.

early_access: true
enable_free_tier: true

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  estimate_code_review_effort: true
  abort_on_close: true
  collapse_walkthrough: true
  sequence_diagrams: true
  poem: false
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: false

  path_filters:
    - '!**/vendor/**'
    - '!**/doc/**'
    - '!**/.yardoc/**'
    - '!**/coverage/**'
    - '!**/tmp/**'
    - '!**/*.gem'
    - '!Gemfile.lock'
    # Generated by `ruby scripts/checks/manifest.rb --write`. Reviewing it means reviewing a
    # generator's output; review the generator instead.
    - '!magik.manifest.json'

  path_instructions:
    - path: '**/*'
      instructions: |
        Conventions live in CLAUDE.md (the working contract), docs/idea/00-build-spec.md (the source
        of truth) and docs/architecture/00-conventions.md. Defer to them and cite the rule.

        BLOCKING, in rough order of how much damage each does:

        1. Claiming unimplemented behaviour. The framework does not exist — no App.define, no model,
           no screen, no action, no policy, no layout, no router, no server, no database code. In a
           comment, a doc, a commit message or a README, the vocabulary is `planned`, `not
           implemented`, `spec only`. A present-tense description of a planned feature is blocking.
        2. A stub that returns nil or an empty result instead of `raise NotImplementedError` naming
           the phase that will implement it. A plausible-looking empty answer is the exact failure
           mode this repository is designed against.
        3. An error without a stable MAGIK_<SUBSYSTEM>_<CONDITION> code, a concrete cause, and a
           `fix:` that is a COMMAND SOMEONE CAN RUN. Advice in a fix: line is a defect, not a style
           difference. SUBSYSTEM must be one of the 21 names in Magik::SUBSYSTEMS.
        4. A status claim with no command beside it that re-derives it, or a benchmark number, or a
           ratio copied into prose. Nothing here has been benchmarked, deployed, or run against a
           real database. Cite the probe (scripts/probes/), never the number — ratios move run to
           run and a re-run contradicts them.
        5. A change that does not trace to a section of docs/idea/00-build-spec.md. No section, no
           change — the answer is a spec amendment (CONTRIBUTING.md), not a PR.
        6. A guardrail shipped later than the feature it guards. If the spec names a boot-time
           refusal for what a diff builds, it lands in the same diff, with its code, cause and fix:.
        7. A convention added as prose. A convention that is not a check does not exist — it needs a
           step in scripts/checks/ or bin/check.
        8. A Float anywhere near currency, including in a fixture, an example or a doc. Integer
           cents, always.
        9. A new runtime dependency, or a second .gemspec. The gem has ZERO runtime dependencies and
           is one gem with subsystem modules, not a monorepo.
        10. A date-stamped claim without `As of YYYY-MM-DD` and the command that re-derives it.

        Runtime facts a diff must not contradict: TruffleRuby is the production runtime and
        concurrency is REAL PARALLEL OS THREADS. There is no GVL, there are no Ractors and no fiber
        scheduler in the design, and `fork` DOES NOT EXIST on TruffleRuby — so Puma runs in single
        mode, capacity comes from more containers, and a test worker is a thread because there is no
        forked worker to fall back to. Falcon cannot boot there; flag any reintroduction. Sequel,
        never ActiveRecord. Minitest, never RSpec. htmx, never a SPA framework or a client build step.

        Review changed lines only. Skip anything RuboCop, YARD coverage or bin/check already enforces.

    - path: 'lib/**'
      instructions: |
        - YARD on EVERY public method: @param, @return, @raise, and at least one @example on
          anything a user calls. `rake yard` holds a 100% floor; an undocumented public method is an
          incomplete change, not a follow-up.
        - One class, one reason to change. New behaviour arrives as a NEW REGISTERED OBJECT, never
          as another branch in a growing `case`. Depend on the narrow role actually used, not on the
          neighbouring module.
        - Subsystem directories are the exact names in Magik::SUBSYSTEMS — inventing a synonym, or
          adding a subsystem with no spec section to point at, is blocking.
        - Imports go strictly DOWN the tier table (scripts/lib/tiers.rb, enforced by
          scripts/checks/boundaries.rb). A same-tier or upward import is a build error, not a taste
          question. `policy` is tier 1 because render and realtime at tier 2 must evaluate it.
        - exe/magik is the binary. bin/ is developer scripts and ships to nobody.
        - lib/magik/version.rb is the ONLY place a version is stated; the gemspec reads it.

    - path: 'lib/magik/cli**'
      instructions: |
        - Every command accepts `--json` and returns the same data in both renderers. A human-only
          output path is blocking — an agent parses the JSON.
        - Magik::CLI::COMMANDS marks every command `ready` or `planned`. "Not built yet" and "not a
          command" are different facts and the CLI must keep saying which is which. A command
          documented in wiki/CLI-Reference.md and absent from COMMANDS fails
          scripts/checks/doc_commands.rb.
        - A `planned` command must refuse to run, with a code and a fix:. It must never half-work.

    - path: 'lib/magik/cli/templates/app/**'
      instructions: |
        - This is what `magik new` writes into a user's project — it is the product, not a fixture.
          Every file must be listed in MANIFEST, and every app directory must have exactly one
          owning agent (pinned by test/magik/app_templates_test.rb).
        - Generated paths are prescribed by wiki/Project-Layout.md and demonstrated by dummy/. A
          generator that invents a path is a bug.
        - A generated app must be safe and usable on its FIRST RUN: every surface names a policy
          verb, the :App layout exists so there is navigation, and the signup form throttles.
        - Generators emit source AND a passing test. A generated `# TODO` is blocking.

    - path: 'test/**'
      instructions: |
        - Minitest, in test/, named *_test.rb. There is no spec/ and there never will be — it is a
          spec decision, not a preference.
        - The suite must pass on BARE RUBY with no bundle (`rake test`). A test that needs a
          development dependency belongs behind the tasks that abort with an install hint.
        - A test must be able to fail for a real reason. Flag assert(true)-shaped assertions and any
          test that would still pass with the implementation deleted.
        - No shared mutable state, no wall clock, no network. The phase-9 runner is thread-parallel
          and there is exactly one worker model.

    - path: 'scripts/**'
      instructions: |
        - Each check asserts ONE promise this repo makes in prose, and fails with a MAGIK_* code, a
          cause and a runnable fix:. A check with no @check/@summary/@order header breaks the
          manifest generator.
        - A new check must be reachable from `bin/check --only checks`, which globs this directory.
          Two checks here were red for an unknown number of commits because nothing ran them; that
          is the bug this rule exists to prevent.
        - Probes (scripts/probes/) measure and print; they never assert a number into a doc. If a
          probe's result is quoted anywhere, the quote must name the probe.

    - path: '{docs,wiki}/**'
      instructions: |
        - docs/idea/00-build-spec.md is the source of truth; everything else elaborates on it and
          nothing contradicts it. Flag any statement that disagrees with it.
        - docs/ is design and spec; wiki/ is the app-author manual. These docs SHIP INSIDE THE GEM,
          version-matched, because Magik's DSL is in no model's training data — so an inaccuracy
          here is an inaccuracy an agent will act on with no way to notice.
        - EVERY fenced ```ruby block must parse. A drafted DSL spelling is not designed until a
          parser has seen it: `retry` is a Ruby keyword (use `retries times:, backoff:`) and
          `computed :name, :type { }` binds the brace block to the symbol (use
          `computed(:name, :type) { }`). Both bugs survived every human reading.
        - Every relative link must resolve (bin/check --only docs). Every documented shell command
          must exist (scripts/checks/doc_commands.rb).
        - One concept, one spelling, everywhere — see the D1-D4 table in the spec and R1-R10 in
          docs/idea/11-dsl-as-tool-surface.md. Durations are the :duration type ("14d", "10m"),
          never `15.minutes` and never a *_days option name.

    - path: 'dummy/**'
      instructions: |
        - This is design-by-example: an invoicing SaaS written in a DSL that DOES NOT EXIST YET. It
          has never executed. Its job is to prove the grammar is expressible and to be the layout
          reference, so review it as documentation that must parse
          (`ruby scripts/checks/dummy_parses.rb`).
        - Every surface reaching a model names a policy verb, or opts out explicitly with
          `policy: :public` / `policy: :system`. There is no third option.
        - It must not invent grammar. If a construct is needed and does not exist in
          docs/idea/02-dsl-surface.md, that is a finding about the SPEC — say so rather than
          inventing a spelling here. An invented `authorize`/`can?` system is what proved `policy`
          was missing.
        - Do not run `rubocop -A` over this directory; .rubocop.yml excludes it because an
          autocorrect once rewrote a Sequel virtual-row block into different behaviour.

    - path: '.github/workflows/**'
      instructions: |
        - `runs-on: ubuntu-latest` only. Flag any self-hosted or paid runner label.
        - CI runs the same commands a contributor runs locally — it splits `bin/check` with
          `--only <step>` so a red step names itself. A NEW bin/check STEP NEEDS A JOB HERE, or it
          silently never runs in CI.
        - `ci` is the single required status check and grades explicitly: skipped is a pass,
          cancelled is NOT.
        - release.yml publishes over OIDC trusted publishing: `id-token: write`, no API key in a
          secret, and no cancel-in-progress — a RubyGems push cannot be undone.
        - A tag is not exempt from the gate.

    - path: '*.gemspec'
      instructions: |
        - ZERO runtime dependencies. The gems Magik intends to wrap are COMMENTS, uncommented by the
          phase that needs each one. Adding one early is blocking.
        - `spec.files` is an allowlist, not a `git ls-files` dump, and it must keep shipping the
          packaged docs (Magik::Docs::PACKAGED_GLOBS) — that is how `magik docs` works offline.
        - required_ruby_version stays ">= 3.2" (CRuby is for tooling only) and
          rubygems_mfa_required stays true.

  auto_review:
    enabled: true
    drafts: false
    base_branches: ['main']

chat:
  auto_reply: true
