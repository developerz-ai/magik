# ASPIRATIONAL — nothing reads this file. Magik is spec only as of 2026-08-26:
# there is no i18n loader, and `t("invoices.new")` resolves to nothing because
# nothing resolves anything. See dummy/README.md.
#
# locales/en.yml  —  one file per locale, named by the locale code.
#
# Every key that appears as `t("...")` anywhere in dummy/app/ appears here.
# That is the property `magik check` is specified to enforce: a translation key
# with no entry renders as a visible placeholder rather than as an empty string,
# and a key here that nothing renders is dead weight.
#
# Declared in config/app.rb: `locales :en, :es, :de, default: :en`.
en:
  # The shell: app/layouts/app.rb. Section headings and nav labels are keys like
  # everything else — a sidebar hard-coded in English is a sidebar that cannot
  # be shipped to the :es and :de locales config/app.rb declares.
  nav:
    work: "Work"

  auth:
    sign_in:
      title: "Sign in"
      email: "Email"
      password: "Password"
      submit: "Sign in"

  dashboard:
    # `title` on a screen is both the browser title and the breadcrumb label the
    # layout's `breadcrumbs` renders, from this one key.
    title: "Dashboard"
    outstanding: "Outstanding"
    overdue: "Overdue"
    plan: "Plan"
    revenue_12m: "Revenue, last 12 months"

  invoices:
    title: "Invoices"
    new: "New invoice"
    number: "Number"
    customer: "Customer"
    total: "Total"
    due: "Due"
    amount: "Amount"
    status: "Status"
    issue: "Issue"
    issue_confirm: "Issue this invoice? Once issued its total cannot change."
    record_payment: "Record payment"
    record: "Record"
    create: "Create"

  onboarding:
    company_name: "Company name"
    currency: "Currency"
    vat_id: "VAT ID"
    customer_name: "Customer name"
    continue: "Continue"
    finish: "Finish"

  notifications:
    invoice_issued:
      subject: "Invoice %{number}"
      title: "Invoice %{number} issued"
    invoice_overdue:
      push: "Invoice %{number} is overdue"
