# Path-based pull-request labels, applied by .github/workflows/labeler.yml (actions/labeler v5
# syntax: every rule is a list of match objects, and `any-glob-to-any-file` means "at least one
# changed file matches at least one of these globs").
#
# The `area:*` names are the subsystem modules from docs/idea/00-build-spec.md, one label per
# directory under apps/magik/lib/magik/. That correspondence is the reason this file is worth keeping: a
# reviewer filtering for `area:ledger` gets the money code and nothing else, and a label that does
# not map onto a directory would be a taxonomy somebody has to maintain by hand.
#
# Each rule matches the subsystem's own directory, its entry file, and its tests, because a change
# to `apps/magik/test/magik/ledger/` is a change to the ledger even when no apps/magik/lib/ file
# moved.
#
# ADDING A SUBSYSTEM: add the directory under apps/magik/lib/magik/, add the rule here, and
# create the label in Settings → Labels. A rule whose label does not exist is silently dropped by
# the API, so the missing half is the label, not the YAML.

# ── Phase 1: foundation ───────────────────────────────────────────────────────────────────────
'area:core':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/magik/lib/magik/core/**'
          - 'apps/magik/lib/magik/core.rb'
          - 'apps/magik/lib/magik.rb'
          - 'apps/magik/lib/magik/version.rb'
          - 'apps/magik/test/magik/core/**'

'area:cli':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/magik/lib/magik/cli/**'
          - 'apps/magik/lib/magik/cli.rb'
          - 'apps/magik/exe/**'
          - 'apps/magik/test/magik/cli/**'

'area:model':
