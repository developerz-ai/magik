# Magik's house RuboCop style, for applications built with Magik.
#
# This file ships INSIDE the magik gem. A generated app's `.rubocop.yml` is a
# dozen lines that `inherit_gem` this one:
#
#     inherit_gem:
#       magik: lib/magik/cli/templates/rubocop.yml
#
# so the rules can improve with `gem update magik` instead of being frozen into
# every app that was ever generated. Nothing here is copied into a user's repo,
# and a user never has to regenerate it.
#
# It is deliberately NOT the framework repo's own `.rubocop.yml`. That one lints
# library code — YARD on every public method, `dummy/` excluded, `exe/magik`
# named oddly. This one lints an application: `app/**` is declaration files,
# `db/migrations/**` is append-only history, and `db/schema.rb` is generated.
#
# An app that disagrees with a rule overrides it in its own `.rubocop.yml`
# below the `inherit_gem`. That is supported and expected — this is a default,
# not a policy.

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  DisplayCopNames: true
  DisplayStyleGuide: true
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "doc/**/*"
    - "coverage/**/*"
    - "tmp/**/*"
    - "log/**/*"
    - "node_modules/**/*"
    # Generated by `magik db schema` and never hand-edited. Linting it means
    # asking the generator to have opinions about style.
    - "db/schema.rb"

# --- Style -------------------------------------------------------------------

# An app's `app/**` files are declarations, not classes: `model :Invoice do … end`
# has nothing for this cop to document. Library-shaped code an app writes under
# `lib/` still carries a doc block.
Style/Documentation:
  Exclude:
    - "app/**/*"
    - "config/**/*"
    - "db/**/*"
    - "test/**/*"
    - "scripts/checks/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: no_comma

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# --- Layout ------------------------------------------------------------------

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - "^\\s*#"

Layout/EmptyLineAfterGuardClause:
  Enabled: true

# --- Metrics -----------------------------------------------------------------
#
# A Magik app is DSL-heavy by design: a `screen` body or a `model` block is one
# long declaration and splitting it for a metric makes it worse to read, not
# better. These limits exist to catch a `perform` block that has quietly become
# a program — not to police a declaration.

Metrics/BlockLength:
  CountAsOne:
    - array
    - hash
    - heredoc
  Exclude:
    - "Rakefile"
    - "app/**/*"       # every declaration is one block
    - "config/**/*"    # App.define is one block, on purpose
    - "db/**/*"
    - "domains/**/*"
    - "test/**/*"

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "db/migrations/**/*"
    - "test/**/*"

Metrics/AbcSize:
  Max: 25
  Exclude:
    - "test/**/*"
    - "bin/**/*"
    - "scripts/**/*"

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"

Metrics/ModuleLength:
  Max: 250
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false

# --- Naming ------------------------------------------------------------------

# `db/migrations/20260826120000_create_invoices.rb` — the timestamp prefix is
# the ordering and is not a Ruby identifier.
Naming/FileName:
  Exclude:
    - "db/migrations/**/*"
    - "bin/**/*"

# --- Minitest ----------------------------------------------------------------

Minitest/MultipleAssertions:
  Max: 12
