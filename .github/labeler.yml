# ── cross-cutting ─────────────────────────────────────────────────────────────────────────────
#
# No `area:` prefix: these are not subsystems, and the distinction is what makes `area:*` a useful
# filter. Their globs mirror the `docs`, `ci` and `dummy` filters in .github/workflows/ci.yml — the
# label a PR carries and the jobs it runs should be answering the same question about the diff.
docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'apps/magik/wiki/**'
          - '**/*.md'
          - 'apps/magik/llms.txt'
          - 'apps/magik/.yardopts'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'bin/**'
          - 'apps/magik/Rakefile'
          - 'apps/magik/.rubocop.yml'

dummy:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/magik/dummy/**'
